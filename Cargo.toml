[package]
name = "cue"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A quiet GNOME scratchpad for notes that need to come back"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
chrono = { version = "0.4.45", features = ["clock"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gio = "0.22.8"
gio-unix = "0.22.8"
glib = "0.22.8"
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50", "blueprint"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.23.0"

[build-dependencies]
glib-build-tools = "0.22.8"

[profile.release]
lto = "thin"
strip = "symbols"
